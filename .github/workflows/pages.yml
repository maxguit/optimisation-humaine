name: Deploy routine to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "OPTIMISATION_HUMAINE_V13_PWA.part-*"
      - ".github/workflows/pages.yml"
      - "mobile-v13_1.css"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check package parts
        id: package
        shell: bash
        run: |
          if [[ -f OPTIMISATION_HUMAINE_V13_PWA.part-00 && -f OPTIMISATION_HUMAINE_V13_PWA.part-01 ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Site package parts are not present yet; deployment is skipped."
          fi

      - name: Reassemble and validate site package
        if: steps.package.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat OPTIMISATION_HUMAINE_V13_PWA.part-00 OPTIMISATION_HUMAINE_V13_PWA.part-01 > site.zip
          echo "c163576a7f4a1194c9aff2e8a4be8858d56e3d9a3defbb46bcbc53aee73fc10f  site.zip" | sha256sum -c -
          rm -rf unpacked _site
          mkdir -p unpacked _site
          unzip -q site.zip -d unpacked
          cp -a unpacked/OPTIMISATION_HUMAINE_V13_PWA/. _site/
          cp mobile-v13_1.css _site/mobile-v13_1.css
          python3 - <<'PY'
          from pathlib import Path
          p=Path("_site/index.html")
          s=p.read_text()
          tag='<link rel="stylesheet" href="mobile-v13_1.css?v=131">'
          if tag not in s:
              s=s.replace("</head>", tag+"\n</head>")
          p.write_text(s)
          sw=Path("_site/service-worker.js")
          t=sw.read_text()
          t=t.replace('const VERSION="oh-v13-1"', 'const VERSION="oh-v13-1-mobile"')
          t=t.replace('"./manifest.webmanifest"', '"./manifest.webmanifest","./mobile-v13_1.css"')
          sw.write_text(t)
          PY
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/manifest.webmanifest
          test -f _site/service-worker.js
          test "$(find _site/media -type f -name '*.mp4' | wc -l)" -eq 45

      - name: Configure Pages
        if: steps.package.outputs.ready == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.package.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        if: steps.package.outputs.ready == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
